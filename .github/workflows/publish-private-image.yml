name: Publish private Docker image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact private release tag to build (vX.Y.Z[-beta.N]-private.N)"
        required: true
        type: string

concurrency:
  group: publish-private-image-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Build and push private image
    runs-on: ubuntu-24.04

    steps:
      - name: Validate private release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?-private\.[1-9][0-9]*$ ]]; then
            echo "Invalid private release tag: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Checkout exact private release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Verify checked-out tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact private image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}
          cache-from: type=gha,scope=codex-lb-private
          cache-to: type=gha,mode=max,scope=codex-lb-private
